version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: postgresdb
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=sae1013
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=restroom
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
#    restart: always 컨테이너 중단시 자동으로 재기동 옵션
volumes:
  pgdata:

# docker-compose down -v 엔터티가 변경된 경우 볼륨을 모두 삭제해야 함
